<div class="heading">
  <p class="eyebrow">ORGANIZACIÓN</p>
  <h2>Categorías</h2>
  <p>Elige una categoría para ver sus productos.</p>
</div>

<div class="grid">
  @for (categoria of categorias; track categoria) {
    <a class="card" [routerLink]="['/productos']" [queryParams]="{ categoria: categoria }">
      <span class="icon">◇</span>
      <span class="card-copy">
        <strong>{{ categoria }}</strong>
        <small>{{ cantidad(categoria) }} productos en esta categoría</small>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  }
</div>
